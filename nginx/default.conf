# ─────────────────────────────────────────────────────────────
# Nginx config: sits in front of Django (Gunicorn) in Docker.
# Browser -> Nginx:80 -> (static/media from disk) or (Gunicorn web:8000 -> Django)
# ─────────────────────────────────────────────────────────────

# "upstream" defines a named group of backend servers Nginx can forward requests to.
# We name it "django" so we can later write proxy_pass http://django;
upstream django {
    # "web" is the docker-compose service name; Docker's internal DNS resolves it
    # to the Django container's IP. 8000 is the port Gunicorn listens on.
    # Add more "server" lines here to load-balance across several containers.
    server web:8000;
}

# A "server" block = one website (virtual host). Nginx picks the block whose
# listen port + server_name match the incoming request.
server {
    # Accept plain HTTP connections on port 80 (inside the container;
    # docker-compose maps host port 80 to this).
    listen 80;

    # Domain names this block answers to (matched against the request's Host header).
    # Replace with your real domain, or use _ to match anything.
    server_name localhost 127.0.0.1;

    # Maximum allowed request body size (file uploads, big POSTs).
    # Bigger requests are rejected with "413 Request Entity Too Large".
    client_max_body_size 20M;

    # Compress responses before sending them, so pages load faster.
    gzip on;
    # Which content types to compress (text/html is always compressed when gzip is on).
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Any URL starting with /static/ is handled here, and Django is never called.
    location /static/ {
        # Map the URL to a folder: /static/css/a.css -> /app/staticfiles/css/a.css
        # This folder is a shared Docker volume filled by "collectstatic".
        alias /app/staticfiles/;
        # Tell browsers to cache these files for 30 days (adds Expires/Cache-Control headers).
        expires 30d;
        # Don't write every CSS/JS/image hit to the access log (less noise and disk I/O).
        access_log off;
    }

    # User-uploaded files (Django's MEDIA_ROOT), served directly from disk too.
    location /media/ {
        # /media/avatars/me.png -> /app/media/avatars/me.png
        alias /app/media/;
    }

    # Everything else (pages, API, admin) goes to Django.
    # "/" matches all URLs; the more specific /static/ and /media/ blocks above win first.
        location / {
        # Forward the request to the "django" upstream defined at the top (web:8000).
        proxy_pass http://django;
        # Pass the original domain the browser asked for. Without this, Django sees
        # "django" as the host, and ALLOWED_HOSTS checks and URL building break.
        proxy_set_header Host $host;
        # Pass the real visitor's IP (otherwise Django only sees Nginx's container IP).
        proxy_set_header X-Real-IP $remote_addr;
        # Append the client IP to the chain of proxies the request has passed through.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Tell Django whether the original request was http or https.
        # Django uses it via SECURE_PROXY_SSL_HEADER for request.is_secure() and redirects.
        proxy_set_header X-Forwarded-Proto $scheme;
        # Don't rewrite "Location" headers in Django's redirect responses; pass them as-is.
        proxy_redirect off;
    }

}

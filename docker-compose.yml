
services:
  db:
    image: postgres:16
    container_name: ticket_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5433:5432"  # host 5433: 5432 is taken by the system PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
      build: .
      restart: unless-stopped
      env_file: .env
      environment:
        POSTGRES_HOST: db
        POSTGRES_PORT: "5432"  # container-to-container port, not the host one
      command: >
        sh -c "python manage.py migrate --noinput &&
              python manage.py collectstatic --noinput &&
              gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
      volumes:
        - static:/app/staticfiles
        - media:/app/media
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
      expose:
        - "8000" 

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/app/staticfiles:ro
      - media:/app/media:ro
    depends_on:
      - web

volumes:
  pgdata:
  static:
  media: